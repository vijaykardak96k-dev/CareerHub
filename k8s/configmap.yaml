apiVersion: v1
kind: ConfigMap
metadata:
  name: careerhub-config
  namespace: careerhub
data:
  SERVER_PORT: "8080"
  DB_HOST: "careerhub-postgres"
  DB_PORT: "5432"
  DB_NAME: "careerhub"
  JWT_EXPIRATION: "86400000"
  FILE_STORAGE_PATH: "/app/storage"
  SEED_DEMO_DATA: "false"
  # Must match the host the browser uses. With the Ingress below, the frontend and
  # the API share an origin, so a relative path is enough.
  CORS_ALLOWED_ORIGINS: "http://careerhub.local"
  API_BASE_URL: "/api/v1"
