# Copy to secret.yaml, replace the values and apply it. secret.yaml is gitignored.
#
#   kubectl -n careerhub create secret generic careerhub-secrets \
#     --from-literal=DB_USERNAME=careerhub \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: careerhub-secrets
  namespace: careerhub
type: Opaque
stringData:
  DB_USERNAME: careerhub
  DB_PASSWORD: REPLACE_WITH_A_STRONG_PASSWORD
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
