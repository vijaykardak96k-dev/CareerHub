apiVersion: v1
kind: Service
metadata:
  name: careerhub-postgres
  namespace: careerhub
spec:
  # Headless: only the backend pods resolve it, it is never exposed outside.
  clusterIP: None
  selector:
    app: careerhub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: careerhub-backend
  namespace: careerhub
spec:
  type: ClusterIP
  selector:
    app: careerhub-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: careerhub-frontend
  namespace: careerhub
spec:
  type: ClusterIP
  selector:
    app: careerhub-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
