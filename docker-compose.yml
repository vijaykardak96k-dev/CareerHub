services:
  postgres:
    image: postgres:16-alpine
    container_name: careerhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careerhub}
      POSTGRES_USER: ${DB_USERNAME:-careerhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careerhub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published to the host by default: only the backend needs to reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-careerhub} -d ${DB_NAME:-careerhub}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - careerhub

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-careerhub-backend:local}
    container_name: careerhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-careerhub}
      DB_USERNAME: ${DB_USERNAME:-careerhub}
      DB_PASSWORD: ${DB_PASSWORD:-careerhub}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-value-at-least-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FILE_STORAGE_PATH: /app/storage
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password@123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - careerhub

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-careerhub-frontend:local}
    container_name: careerhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Read by the container entrypoint and written into /config.js at startup.
      # The browser calls this URL directly, so it must be reachable from the
      # browser, not from inside the Docker network.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - careerhub

volumes:
  postgres-data:
  backend-storage:

networks:
  careerhub:
    driver: bridge
