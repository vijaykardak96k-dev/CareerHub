server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: careerhub-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerhub}
    username: ${DB_USERNAME:careerhub}
    password: ${DB_PASSWORD:careerhub}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  storage:
    path: ${FILE_STORAGE_PATH:./uploads}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    password: ${SEED_PASSWORD:Password@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.careerhub: INFO
