apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "careerhub.name" . }}-backend-storage
  namespace: {{ include "careerhub.namespace" . }}
  labels:
    {{- include "careerhub.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "careerhub.name" . }}-backend
  namespace: {{ include "careerhub.namespace" . }}
  labels:
    {{- include "careerhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "careerhub.name" . }}-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ include "careerhub.name" . }}-backend
      annotations:
        # Restart the pods when the config or the secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "careerhub.name" . }}-config
            - secretRef:
                name: {{ include "careerhub.name" . }}-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.config.fileStoragePath }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "careerhub.name" . }}-backend-storage
