apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "careerhub.name" . }}-frontend
  namespace: {{ include "careerhub.namespace" . }}
  labels:
    {{- include "careerhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "careerhub.name" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "careerhub.name" . }}-frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # Written into /config.js by the container entrypoint at startup.
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "careerhub.name" . }}-config
                  key: API_BASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
