{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "careerhub.name" . }}
  namespace: {{ include "careerhub.namespace" . }}
  labels:
    {{- include "careerhub.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "careerhub.name" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "careerhub.name" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "careerhub.name" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "careerhub.name" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
